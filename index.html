<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glass-card">
        <h1>ThermoShift 🌡️</h1>
        <p class="subtitle">Konversi suhu secara instan dan akurat</p>

        <form id="converter-form" onsubmit="return false;">
            <!-- Input Angka -->
            <div class="input-group">
                <label for="temp-input">Nilai Suhu</label>
                <input type="number" id="temp-input" placeholder="Masukkan angka..." step="any" required>
            </div>

            <!-- DARI Suhu -->
            <div class="input-group">
                <label for="from-unit">Dari Unit</label>
                <select id="from-unit">
                    <option value="C">Celsius (°C)</option>
                    <option value="F">Fahrenheit (°F)</option>
                    <option value="K">Kelvin (K)</option>
                    <option value="R">Réaumur (°R)</option>
                </select>
            </div>

            <!-- KE Suhu -->
            <div class="input-group">
                <label for="to-unit">Ke Unit</label>
                <select id="to-unit">
                    <option value="F">Fahrenheit (°F)</option>
                    <option value="C">Celsius (°C)</option>
                    <option value="K">Kelvin (K)</option>
                    <option value="R">Réaumur (°R)</option>
                </select>
            </div>

            <!-- Tombol Aksi -->
            <div class="button-group">
                <button type="button" id="convert-btn">Konversi Sekarang</button>
                <button type="button" id="reset-btn" class="secondary">Reset</button>
            </div>
        </form>

        <!-- Area Hasil -->
        <div class="result-container" id="result-container">
            <div class="result-label">Hasil Konversi:</div>
            <div class="result-value" id="result-text">--</div>
            <div class="result-formula" id="formula-text">Pilih unit dan masukkan nilai</div>
        </div>
    </div>

    <!-- Script dimuat secara modular -->
    <script src="converter.js"></script>
    <script src="app.js"></script>
</body>
</html>
